<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div id="app">
        <div id="login-screen" class="screen">
            <div class="login-card">
                <h1>Вход в админ-панель</h1>
                <p class="hint">Введите логин, пароль и токен из .env</p>
                <form id="login-form" action="javascript:void(0)" method="post">
                    <label>
                        <span>Логин</span>
                        <input type="text" name="login" id="input-login" autocomplete="username" required>
                    </label>
                    <label>
                        <span>Пароль</span>
                        <input type="password" name="password" id="input-password" autocomplete="current-password" required>
                    </label>
                    <label>
                        <span>Токен</span>
                        <input type="password" name="token" id="input-token" autocomplete="off" required>
                    </label>
                    <button type="submit" id="login-btn">Войти</button>
                </form>
                <div id="login-error" class="error-box hidden" role="alert"></div>
            </div>
        </div>

        <div id="dashboard-screen" class="screen hidden">
            <header class="header">
                <h1>Админ-панель</h1>
                <button type="button" id="logout-btn" class="btn btn-outline">Выйти</button>
            </header>
            <nav class="tabs">
                <button type="button" data-tab="stats" class="tab active">Статистика</button>
                <button type="button" data-tab="users" class="tab">Пользователи</button>
                <button type="button" data-tab="reports" class="tab">Жалобы</button>
                <button type="button" data-tab="broadcast" class="tab">Рассылка</button>
            </nav>

            <section id="tab-stats" class="tab-panel active">
                <div id="stats-loading" class="loading">Загрузка…</div>
                <div id="stats-content" class="stats-grid hidden"></div>
            </section>

            <section id="tab-users" class="tab-panel">
                <div class="users-recent-block">
                    <h3 class="users-recent-title">Последние 10 пользователей</h3>
                    <div id="users-recent-loading" class="loading hidden">Загрузка…</div>
                    <div id="users-recent-list" class="users-recent-list"></div>
                </div>
                <div class="search-bar">
                    <input type="text" id="user-search" placeholder="ID или username пользователя">
                    <button type="button" id="user-search-btn" class="btn">Найти</button>
                </div>
                <div id="user-result" class="user-result"></div>
            </section>

            <section id="tab-reports" class="tab-panel">
                <div class="reports-toolbar">
                    <select id="reports-status">
                        <option value="pending">Ожидают</option>
                        <option value="resolved">Рассмотрены</option>
                    </select>
                    <button type="button" id="reports-refresh" class="btn">Обновить</button>
                </div>
                <div id="reports-loading" class="loading hidden">Загрузка…</div>
                <div id="reports-list" class="reports-list"></div>
            </section>

            <section id="tab-broadcast" class="tab-panel">
                <div class="broadcast-form">
                    <label>
                        <span>Сегмент получателей</span>
                        <select id="broadcast-gender">
                            <option value="all">Все пользователи</option>
                            <option value="Мужской">Только мужчины</option>
                            <option value="Женский">Только женщины</option>
                        </select>
                    </label>
                    <label>
                        <span>Фото (необязательно)</span>
                        <input type="file" id="broadcast-photo" accept="image/jpeg,image/png,image/webp">
                        <div id="broadcast-photo-preview" class="broadcast-photo-preview hidden"></div>
                        <button type="button" id="broadcast-photo-clear" class="btn btn-small hidden">Убрать фото</button>
                    </label>
                    <label>
                        <span>Текст сообщения</span>
                        <textarea id="broadcast-text" rows="6" placeholder="Введите текст рассылки (подпись к фото или просто текст)..."></textarea>
                    </label>
                    <div class="broadcast-actions">
                        <button type="button" id="broadcast-preview-btn" class="btn">Предпросмотр</button>
                        <button type="button" id="broadcast-send-btn" class="btn btn-primary">Отправить рассылку</button>
                    </div>
                    <div id="broadcast-preview" class="broadcast-preview hidden"></div>
                    <div id="broadcast-error" class="error-box hidden"></div>
                </div>
            </section>
        </div>
    </div>
    <script src="admin.js"></script>
    <script>
        // Резервный вход: если admin.js не загрузился, форма всё равно отправит запрос и покажет ошибку
        (function () {
            var form = document.getElementById("login-form");
            if (!form) return;
            form.addEventListener("submit", function (e) {
                e.preventDefault();
                e.stopPropagation();
                if (window.AdminPanelReady) return;
                var loginEl = form.querySelector('[name="login"]');
                var passwordEl = form.querySelector('[name="password"]');
                var tokenEl = form.querySelector('[name="token"]');
                var login = loginEl ? loginEl.value.trim() : "";
                var password = passwordEl ? passwordEl.value.trim() : "";
                var token = tokenEl ? tokenEl.value.trim() : "";
                if (!login || !password || !token) {
                    var err = document.getElementById("login-error");
                    if (err) { err.textContent = "Заполните все поля"; err.classList.remove("hidden"); }
                    return;
                }
                var err = document.getElementById("login-error");
                var btn = document.getElementById("login-btn");
                if (err) { err.classList.add("hidden"); err.textContent = ""; }
                if (btn) { btn.disabled = true; btn.textContent = "Вход…"; }
                fetch("/admin/api/auth", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ login: login, password: password, token: token })
                }).then(function (r) {
                    return r.json().catch(function () { return {}; }).then(function (b) {
                        return { ok: r.ok, status: r.status, body: b };
                    });
                }).then(function (x) {
                    if (btn) { btn.disabled = false; btn.textContent = "Войти"; }
                    if (x.ok && x.body && x.body.access_token) {
                        try { localStorage.setItem("admin_token", x.body.access_token); } catch (z) {}
                        window.location.reload();
                    } else if (err) {
                        err.textContent = (x.body && x.body.detail) ? x.body.detail : ("Ошибка входа (код " + x.status + ")");
                        err.classList.remove("hidden");
                    }
                }).catch(function () {
                    if (btn) { btn.disabled = false; btn.textContent = "Войти"; }
                    if (err) {
                        err.textContent = "Не удалось подключиться к серверу. Откройте админку с того же домена (например http://localhost:8080/admin/).";
                        err.classList.remove("hidden");
                    }
                });
            });
        })();
    </script>
</body>
</html>
