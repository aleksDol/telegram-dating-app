# Полный рабочий конфиг для /etc/nginx/sites-available/default
# Скопируйте целиком на сервер и замените содержимое файла:
#   sudo nano /etc/nginx/sites-available/default
# Удалите всё, вставьте это, сохраните (Ctrl+O, Enter, Ctrl+X).
# Затем: sudo nginx -t  &&  sudo systemctl start nginx

# Default server (оставляем для запросов не на spontime.ru)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /var/www/html;
    index index.html index.htm index.nginx-debian.html;
    location / {
        try_files $uri $uri/ =404;
    }
}

# spontime.ru — редирект HTTP → HTTPS (Certbot)
server {
    listen 80;
    listen [::]:80;
    server_name spontime.ru;
    if ($host = spontime.ru) {
        return 301 https://$host$request_uri;
    }
    return 404;
}

# spontime.ru — HTTPS, прокси на Docker (порт 8080)
server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    server_name spontime.ru;

    ssl_certificate /etc/letsencrypt/live/spontime.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/spontime.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Лимит тела запроса для загрузки фото (события, профиль — base64 в JSON)
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
