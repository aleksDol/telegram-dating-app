server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Резолвер Docker (нужен для proxy_pass с переменной — имя backend)
    resolver 127.0.0.11 valid=10s;
    resolver_timeout 5s;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # SPA: все запросы к статике, остальное — index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Админ-панель: статика из /admin, API — на бэкенд
    location = /admin {
        return 302 /admin/;
    }
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control "no-cache";
    }
    location /admin/api/ {
        set $backend_upstream backend;
        proxy_pass http://$backend_upstream:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Проксирование API на бэкенд (переменная — резолвинг при запросе, не при старте nginx)
    location /api/ {
        set $backend_upstream backend;
        proxy_pass http://$backend_upstream:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Telegram-Init-Data $http_x_telegram_init_data;
        proxy_set_header X-Dev-User-Id $http_x_dev_user_id;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000";
    }
}
